# Tests the local action (uses: ./) by publishing the fixture package to
# TestPyPI (never real PyPI) via Trusted Publishing. Covers four paths:
#   - publish: the happy path on a non-tag ref (Sigstore verification
#     skipped, matching a normal branch/PR build).
#   - reject-tampered-checksums: publish must fail closed on a corrupted
#     "dist" artifact, before it ever attempts to publish anything.
#   - build-and-sign-tag / publish-tag: a tag push, which is the only ref
#     type that exercises this action's Sigstore signature verification.
#     Triggered by manually pushing a "test-vX" tag; never a real release
#     tag.
#   - build-with-build-action / publish-build-action: builds the fixture
#     with durandtibo/build-pypi-package-action instead of a plain
#     "uv build", to verify this action stays compatible with the "dist"
#     artifact (contents and SHA256SUMS format) that action produces on a
#     non-tag ref.
#   - build-and-sign-tag-with-build-action / publish-tag-build-action: same
#     compatibility check as above, but on a tag push, so it also covers
#     Sigstore signing/verification against that action's "dist" artifact.
#     Triggered by pushing a "test-build-vX" tag (a distinct prefix from
#     "test-vX", so the two tag jobs never run in the same workflow run
#     and their "dist"/"signatures" artifact names never collide).
#
# This workflow and test-stable.yaml trigger independently on the same
# events (each is a separate run), rather than being chained from a shared
# dispatcher, since this action's action.yml hardcodes the "dist" and
# "signatures" artifact names it downloads (no artifact-name input like
# build-pypi-package-action has). Running local and stable as separate runs
# avoids the two variants racing to upload/download identically-named
# artifacts within a single run.
#
# One-time setup required before this can pass: register a TestPyPI Trusted
# Publisher for a "pypi-release-action-fixture" project pointing at this
# repo, workflow file "test-local.yaml", environment "testpypi". See
# https://docs.pypi.org/trusted-publishers/adding-a-publisher/
# (use test.pypi.org's equivalent page). test-stable.yaml needs its own
# Trusted Publisher entry (workflow file "test-stable.yaml") since PyPI
# Trusted Publishers key off repo + workflow filename + environment.
#
# Each publish targets a unique fixture version (derived from the run ID),
# since TestPyPI rejects re-uploading an existing version.

name: Test Local Action

on:
  workflow_dispatch:
  push:
    tags:
      - "test-v*"
      - "test-build-v*"

permissions:
  contents: read

jobs:
  build:
    # Publishing isn't OS-dependent, so a single build here just produces
    # the one "dist" artifact this action's tests consume. Uses a plain
    # "uv build" rather than the build-pypi-package-action, to keep this
    # repo's tests independent of that other action.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Set unique fixture version
        run: sed -i "s/^version = .*/version = \"0.0.1.dev${{ github.run_id }}\"/" pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

  publish:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pypi-release-action-fixture/
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run publish action
        uses: ./
        with:
          workflow-filename: test-local.yaml
          repository-url: https://test.pypi.org/legacy/

  reject-tampered-checksums:
    # publish must fail closed if the downloaded "dist" artifact doesn't
    # match the checksums recorded at build time (e.g. artifact corruption
    # or tampering), before it ever attempts to publish anything. Doesn't
    # need PyPI/OIDC permissions since it never reaches the publish step.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Tamper with a built distribution
        run: echo "corrupted" >> dist/*.tar.gz

      - name: Upload dist artifact under the name publish expects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Run publish action
        id: publish
        continue-on-error: true
        uses: ./
        with:
          workflow-filename: test-local.yaml
          repository-url: https://test.pypi.org/legacy/

      - name: Assert publish action failed
        run: |
          test "${{ steps.publish.outcome }}" = "failure" || {
            echo "::error::expected publish to fail on tampered checksums, got outcome=${{ steps.publish.outcome }}"; exit 1;
          }

  build-with-build-action:
    # Builds the fixture with durandtibo/build-pypi-package-action rather
    # than a plain "uv build", so publish-build-action below exercises this
    # action against that action's real "dist" artifact output.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Set unique fixture version
        run: sed -i "s/^version = .*/version = \"0.0.1.dev${{ github.run_id }}\"/" pyproject.toml

      - name: Run build action
        uses: durandtibo/build-pypi-package-action@3781c7eb97f68448f70e67e386f03aac7f7be384 # ratchet:durandtibo/build-pypi-package-action@v0.0.2
        with:
          artifact-name: dist-build-action

  publish-build-action:
    needs: build-with-build-action
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pypi-release-action-fixture/
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Download distribution artifacts built by build-pypi-package-action
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist-build-action
          path: dist/

      - name: Assert dist layout and SHA256SUMS format are as this action expects
        run: |
          cd dist
          test -f SHA256SUMS || {
            echo "::error::build-pypi-package-action did not produce a SHA256SUMS file"; exit 1;
          }
          compgen -G "*.tar.gz" > /dev/null || {
            echo "::error::no sdist (*.tar.gz) found in dist artifact"; exit 1;
          }
          compgen -G "*.whl" > /dev/null || {
            echo "::error::no wheel (*.whl) found in dist artifact"; exit 1;
          }
          sha256sum --check SHA256SUMS

      - name: Re-upload under the artifact name publish expects
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 1

      - name: Run publish action
        uses: ./
        with:
          workflow-filename: test-local.yaml
          repository-url: https://test.pypi.org/legacy/

  build-and-sign-tag:
    # Only a tag push reaches this action's Sigstore verification steps, so
    # this job (and publish-tag below) is the only coverage for that path.
    # Excludes "test-build-v*" tags so its "dist"/"signatures" artifacts
    # never collide with build-and-sign-tag-with-build-action's.
    if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'test-build-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Set unique fixture version
        run: sed -i "s/^version = .*/version = \"0.0.1.dev${{ github.run_id }}\"/" pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # ratchet:astral-sh/setup-uv@v10.1.0

      - name: Build package
        run: uv build

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tar.gz *.whl > SHA256SUMS

      - name: Sign distributions with Sigstore
        run: uvx sigstore sign dist/*.tar.gz dist/*.whl

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          retention-days: 1

      - name: Upload signature bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: signatures
          path: dist/*.sigstore*
          retention-days: 1

  publish-tag:
    needs: build-and-sign-tag
    if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'test-build-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pypi-release-action-fixture/
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run publish action
        uses: ./
        with:
          workflow-filename: test-local.yaml
          repository-url: https://test.pypi.org/legacy/

  build-and-sign-tag-with-build-action:
    # Same compatibility check as build-with-build-action, but on a tag
    # push: verifies this action's Sigstore verification step also accepts
    # signatures produced against build-pypi-package-action's "dist"
    # artifact, not just a plain "uv build" one. Runs only for
    # "test-build-v*" tags (see build-and-sign-tag above).
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'test-build-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # Sigstore keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Stage fixture package at repo root
        run: cp -r test/fixtures/pkg/. .

      - name: Set unique fixture version
        run: sed -i "s/^version = .*/version = \"0.0.1.dev${{ github.run_id }}\"/" pyproject.toml

      - name: Run build action
        uses: durandtibo/build-pypi-package-action@3781c7eb97f68448f70e67e386f03aac7f7be384 # ratchet:durandtibo/build-pypi-package-action@v0.0.2
        with:
          artifact-name: dist-build-action

      - name: Download distribution artifacts built by build-pypi-package-action
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          name: dist-build-action
          path: dist/

      - name: Sign distributions with Sigstore
        run: uvx sigstore sign dist/*.tar.gz dist/*.whl

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          retention-days: 1

      - name: Upload signature bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: signatures
          path: dist/*.sigstore*
          retention-days: 1

  publish-tag-build-action:
    needs: build-and-sign-tag-with-build-action
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'test-build-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pypi-release-action-fixture/
    permissions:
      id-token: write # PyPI Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      - name: Run publish action
        uses: ./
        with:
          workflow-filename: test-local.yaml
          repository-url: https://test.pypi.org/legacy/
